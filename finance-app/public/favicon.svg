<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="100" height="100" fill="url(#bgGradient)" rx="22" ry="22"/>
  
  <!-- Dollar sign in coin -->
  <circle cx="50" cy="45" r="18" fill="url(#coinGradient)" filter="url(#shadow)"/>
  <text x="50" y="52" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">$</text>
  
  <!-- Growth arrow -->
  <path d="M25 75 L35 65 L45 70 L55 60 L65 55 L75 45" 
        stroke="white" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>
  
  <!-- Arrow head -->
  <path d="M70 40 L75 45 L70 50 L75 45 L65 45" 
        stroke="white" 
        stroke-width="3" 
        fill="white" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Small decorative elements -->
  <circle cx="20" cy="20" r="3" fill="white" opacity="0.6"/>
  <circle cx="80" cy="25" r="2" fill="white" opacity="0.4"/>
  <circle cx="85" cy="80" r="2.5" fill="white" opacity="0.5"/>
</svg>